services:
  # ----------------------------------------------------
  # Frontend Service (Vite Static Web served by Nginx)
  # ----------------------------------------------------
  web-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vietnam-food-travel-frontend
    restart: always
    ports:
      - "8088:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

